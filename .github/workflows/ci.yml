name: Web CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            api_sha:
                description: Commit completo da API para os testes integrados
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Qualidade do código
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm run typecheck
            - run: npm audit --audit-level=high

    unit:
        name: Testes unitários
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run test:unit

    interface:
        name: Interface mobile e desktop
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run test:interface

    e2e:
        name: Jornadas com API (${{ matrix.group }})
        needs: quality
        runs-on: ubuntu-24.04
        timeout-minutes: 35
        strategy:
            fail-fast: false
            max-parallel: 3
            matrix:
                group: [0, 1, 2]
        env:
            API_SHA: ${{ inputs.api_sha || '46f3895b3b9451cf3a46c74aeec7b0e641556ca9' }}
            E2E_PREBUILT: '1'
        defaults:
            run:
                working-directory: prospera-mais-web
        steps:
            - name: Obter Web
              uses: actions/checkout@v7
              with:
                  path: prospera-mais-web
                  persist-credentials: false
            - name: Validar referência imutável da API
              run: test "${#API_SHA}" -eq 40 && [[ "$API_SHA" =~ ^[0-9a-f]{40}$ ]]
            - name: Obter API
              uses: actions/checkout@v7
              with:
                  repository: limaelton-dev/prospera_mais_api
                  ref: ${{ env.API_SHA }}
                  path: prospera-mais-api
                  persist-credentials: false
            - name: Conferir versão da API
              run: test "$(git -C ../prospera-mais-api rev-parse HEAD)" = "$API_SHA"
            - uses: actions/setup-node@v7
              with:
                  node-version-file: prospera-mais-web/.nvmrc
                  cache: npm
                  cache-dependency-path: |
                      prospera-mais-web/package-lock.json
                      prospera-mais-api/package-lock.json
            - name: Instalar Web
              run: npm ci
            - name: Instalar e compilar API
              working-directory: prospera-mais-api
              run: npm ci && npm run build
            - name: Compilar Web para as jornadas
              env:
                  NEXT_PUBLIC_API_URL: http://localhost:3101/v2
                  NEXT_DIST_DIR: .next-e2e
              run: npm run build
            - run: npx playwright install --with-deps chromium
            - name: Iniciar PostgreSQL descartável
              working-directory: prospera-mais-api
              run: docker compose -f compose.test.yaml up -d --wait
            - name: Executar todas as jornadas, com API isolada por suíte
              env:
                  GROUP: ${{ matrix.group }}
              run: |
                  mapfile -t suites < <(find tests/e2e -type f -name '*.spec.ts' | LC_ALL=C sort)
                  test "${#suites[@]}" -gt 0
                  result=0
                  for index in "${!suites[@]}"; do
                      if (( index % 3 != GROUP )); then continue; fi
                      npm run test:e2e -- "${suites[$index]}" || result=1
                  done
                  exit "$result"
            - name: Encerrar PostgreSQL descartável
              if: always()
              working-directory: prospera-mais-api
              run: docker compose -f compose.test.yaml down

    checks:
        # This exact name is already required by the main branch ruleset.
        name: Web checks
        if: always()
        needs: [quality, unit, interface, e2e]
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Exigir aprovação de todas as verificações
              env:
                  RESULTS: ${{ toJSON(needs) }}
              run: |
                  node -e 'const jobs = JSON.parse(process.env.RESULTS); for (const [name, job] of Object.entries(jobs)) { console.log(`${name}: ${job.result}`); } process.exit(Object.values(jobs).every(job => job.result === "success") ? 0 : 1);'
