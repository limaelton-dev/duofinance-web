name: Web CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:
        inputs:
            api_sha:
                description: Commit completo da API para os testes integrados
                required: false
                type: string
            full_e2e:
                description: Executar todos os cards e testes de dados
                required: false
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Web checks
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        env:
            NEXT_PUBLIC_API_URL: http://localhost:3001/v2

        steps:
            - name: Obter o código
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Preparar Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Instalar dependências
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Formatação
              run: npm run format:check

            - name: Tipos
              run: npm run typecheck

            - name: Build
              run: npm run build

    interface:
        name: Interface mobile e desktop
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Obter o código
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Preparar Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Instalar dependências
              run: npm ci
            - name: Preparar Chromium
              run: npx playwright install --with-deps chromium
            - name: Verificar interface e acessibilidade
              run: npm run test:interface

    select_e2e:
        name: Selecionar suítes Playwright
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            suites: ${{ steps.select.outputs.suites }}

        steps:
            - name: Obter o código e histórico
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Selecionar cards alterados ou o mais recente
              id: select
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
                  FULL_E2E: ${{ inputs.full_e2e || false }}
              run: |
                  selected=()
                  if [[ "$FULL_E2E" == "true" ]]; then
                      mapfile -t selected < <(find e2e -maxdepth 1 -type f -name 'card-[0-9][0-9][0-9].spec.ts' -printf '%f\n' | sort -V)
                      selected+=('.*-data.spec.ts')
                  elif [[ "$EVENT_NAME" == "pull_request" ]]; then
                      if git diff --name-only "${BASE_SHA}...${HEAD_SHA}" -- src/app src/components src/features/auth src/features/spaces src/features/today src/features/finances | grep -q .; then
                          for suite in e2e/card-[0-9][0-9][0-9].spec.ts; do
                              selected+=("${suite#e2e/}")
                          done
                          selected+=('.*-data.spec.ts')
                      fi
                      mapfile -t changed < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" -- e2e | sed -nE 's#^e2e/(card-[0-9]{3}\.spec\.ts|[A-Za-z0-9_-]+-data\.spec\.ts)$#\1#p' | sort -u)
                      for suite in "${changed[@]}"; do
                          if [[ -f "e2e/$suite" ]]; then
                              selected+=("$suite")
                          fi
                      done
                  fi
                  if (( ${#selected[@]} == 0 )); then
                      latest="$(find e2e -maxdepth 1 -type f -name 'card-[0-9][0-9][0-9].spec.ts' -printf '%f\n' | sort -V | tail -n 1)"
                      test -n "$latest"
                      selected=("$latest")
                  fi
                  mapfile -t selected < <(printf '%s\n' "${selected[@]}" | sort -u)
                  suites='['
                  for suite in "${selected[@]}"; do
                      if [[ "$suites" != '[' ]]; then suites+=','; fi
                      suites+="\"$suite\""
                  done
                  suites+=']'
                  echo "suites=$suites" >> "$GITHUB_OUTPUT"
                  echo "Suítes selecionadas: $suites"

    e2e:
        name: Playwright (${{ matrix.suite }})
        needs: [checks, select_e2e]
        runs-on: ubuntu-24.04
        timeout-minutes: 25

        strategy:
            fail-fast: false
            max-parallel: 3
            matrix:
                suite: ${{ fromJSON(needs.select_e2e.outputs.suites) }}

        env:
            API_SHA: ${{ inputs.api_sha || 'b72d07fe8993223f11545ae957e2396fcaf9e60c' }}

        defaults:
            run:
                working-directory: prospera-mais-web

        steps:
            - name: Obter Web
              uses: actions/checkout@v7
              with:
                  path: prospera-mais-web
                  persist-credentials: false

            - name: Validar referência imutável da API
              run: test "${#API_SHA}" -eq 40 && [[ "$API_SHA" =~ ^[0-9a-f]{40}$ ]]

            - name: Obter API no commit definido
              uses: actions/checkout@v7
              with:
                  repository: limaelton-dev/prospera_mais_api
                  ref: ${{ env.API_SHA }}
                  path: prospera-mais-api
                  persist-credentials: false

            - name: Conferir par API e Web
              run: |
                  test "$(git -C ../prospera-mais-api rev-parse HEAD)" = "$API_SHA"
                  git -C ../prospera-mais-api rev-parse HEAD
                  git rev-parse HEAD

            - name: Preparar Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: prospera-mais-web/.nvmrc
                  cache: npm
                  cache-dependency-path: |
                      prospera-mais-web/package-lock.json
                      prospera-mais-api/package-lock.json

            - name: Instalar dependências Web
              run: npm ci

            - name: Instalar dependências API
              working-directory: prospera-mais-api
              run: npm ci

            - name: Preparar Chromium
              run: npx playwright install --with-deps chromium

            - name: Iniciar PostgreSQL descartável
              working-directory: prospera-mais-api
              run: docker compose -f compose.test.yaml up -d --wait

            - name: Jornada automatizada
              env:
                  E2E_SUITE: ${{ matrix.suite }}
              run: npm run test:e2e -- "$E2E_SUITE"

            - name: Encerrar PostgreSQL descartável
              if: always()
              working-directory: prospera-mais-api
              run: docker compose -f compose.test.yaml down
